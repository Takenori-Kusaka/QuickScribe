name: perf-bench

# 非機能（パフォーマンス）ベンチ（#403）。ローカル whisper の文字起こし RTF（実時間比）と
# ピークメモリ(RSS)を固定音源で計測し、結果をアーティファクト＋ジョブサマリに残す。
# 手動(workflow_dispatch)＋リリース公開時に実行。CI(PR)は重くしないため分離。
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  transcribe-rtf:
    name: 文字起こし RTF / メモリ (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (whisper build + espeak-ng + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev build-essential file clang libclang-dev cmake \
            libasound2-dev pkg-config espeak-ng ffmpeg time

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate icons (tauri generate_context にアイコンが必要)
        run: npm run icons

      - name: Cache whisper model
        id: cache-model
        uses: actions/cache@v6
        with:
          path: models/ggml-tiny.bin
          key: ggml-tiny-bin-v1
      - name: Download tiny whisper model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -L --fail --retry 5 --retry-delay 15 --retry-all-errors \
            -o models/ggml-tiny.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin

      - name: Generate fixed bench audio (~固定長)
        run: |
          # 一定量の既知発話を生成（RTF を安定させるため文章を長めに）。
          espeak-ng "This is a performance benchmark for QuickScribe. \
            The quick brown fox jumps over the lazy dog. \
            Speech recognition latency is measured as a real time factor. \
            We repeat this paragraph to obtain a stable measurement window. \
            The quick brown fox jumps over the lazy dog again and again." \
            -s 150 -w bench.wav
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 bench.wav)
          echo "AUDIO_DURATION=$DUR" >> "$GITHUB_ENV"
          echo "音源長: ${DUR}s"

      - name: Build test binary (compile excluded from timing)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test transcribe_integration --no-run

      - name: Measure transcription (RTF + peak RSS)
        env:
          QS_MODEL_PATH: ${{ github.workspace }}/models/ggml-tiny.bin
          QS_AUDIO_PATH: ${{ github.workspace }}/bench.wav
          # 精度(CER)計算のため認識テキストをファイルへ出力させる(#403)。
          QS_TRANSCRIPT_OUT: ${{ github.workspace }}/transcript.txt
        run: |
          /usr/bin/time -v cargo test --manifest-path src-tauri/Cargo.toml \
            --test transcribe_integration -- --nocapture 2> time.txt || { cat time.txt; exit 1; }
          ELAPSED_RAW=$(grep "Elapsed (wall clock)" time.txt | awk '{print $NF}')
          MAXRSS_KB=$(grep "Maximum resident set size" time.txt | awk '{print $NF}')
          # m:ss(.ss) または h:mm:ss を秒へ。
          ELAPSED_S=$(echo "$ELAPSED_RAW" | awk -F: '{ if (NF==3) print $1*3600+$2*60+$3; else print $1*60+$2 }')
          RTF=$(awk -v e="$ELAPSED_S" -v d="$AUDIO_DURATION" 'BEGIN{ if (d>0) printf "%.3f", e/d; else print "n/a" }')
          MAXRSS_MB=$(awk -v k="$MAXRSS_KB" 'BEGIN{ printf "%.1f", k/1024 }')
          {
            echo "# QuickScribe 文字起こしベンチ (ggml-tiny / Linux x64 AVX2)"
            echo ""
            echo "| 指標 | 値 |"
            echo "|---|---|"
            echo "| 音源長 | ${AUDIO_DURATION}s |"
            echo "| 経過(計測区間, コンパイル除く) | ${ELAPSED_S}s |"
            echo "| **RTF (実時間比)** | **${RTF}** |"
            echo "| ピークメモリ (RSS) | ${MAXRSS_MB} MB |"
            echo ""
            echo "_注: cargo test 実行のオーバーヘッドを含む概算。RTF<1.0 が実時間以内の目安。_"
          } | tee perf-report.md
          cat perf-report.md >> "$GITHUB_STEP_SUMMARY"

      # 精度(CER)ベンチ(#403): 既知の英語発話に対する文字誤り率。espeak 生成の高品質英語音声を
      # ggml-tiny で認識し、参照文との CER を測る。パイプライン回帰の検知が目的（実運用精度の
      # 主張ではない。実データ(JSUT/CSJ)による日本語精度は #26 で別途）。
      - name: Measure accuracy (CER, English)
        env:
          # espeak へ渡した参照文と一致させる（正規化して比較）。
          REF_TEXT: >-
            This is a performance benchmark for QuickScribe.
            The quick brown fox jumps over the lazy dog.
            Speech recognition latency is measured as a real time factor.
            We repeat this paragraph to obtain a stable measurement window.
            The quick brown fox jumps over the lazy dog again and again.
        run: |
          python3 - <<'PY' | tee -a perf-report.md
          import os, re
          def norm(s):
              s = s.lower()
              s = re.sub(r"[^a-z0-9\s]", " ", s)      # 記号除去
              return re.sub(r"\s+", " ", s).strip()
          def cer(ref, hyp):
              # 文字レベル Levenshtein 距離 / 参照長。
              r, h = list(ref), list(hyp)
              dp = list(range(len(h) + 1))
              for i in range(1, len(r) + 1):
                  prev, dp[0] = dp[0], i
                  for j in range(1, len(h) + 1):
                      cur = dp[j]
                      dp[j] = min(dp[j] + 1, dp[j-1] + 1, prev + (r[i-1] != h[j-1]))
                      prev = cur
              return dp[len(h)] / max(1, len(r))
          ref = norm(os.environ["REF_TEXT"])
          try:
              hyp = norm(open("transcript.txt", encoding="utf-8").read())
          except FileNotFoundError:
              print("\n_精度: transcript 未出力のためスキップ_"); raise SystemExit(0)
          rate = cer(ref, hyp)
          print("")
          print("| 精度指標 | 値 |")
          print("|---|---|")
          print(f"| 参照文字数(正規化) | {len(ref)} |")
          print(f"| **CER (英語・文字誤り率)** | **{rate*100:.1f}%** |")
          print("")
          print("_注: espeak合成の英語音声に対する回帰指標。日本語精度は実データで #26 にて別途。_")
          PY
          cat perf-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload perf report
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: perf-report.md
          if-no-files-found: error

  # 日本語精度ベンチ(#26 / #403): 実データ(本人音読のPD作品)に対する CER(文字誤り率)を、
  # モデル別(tiny/base/large-v3-turbo)に計測する。モデルカタログ精選(不要な選択肢を増やさない)と
  # 精度回帰の検知が目的。turbo は日本語既定(ADR-0025 #4でベンチ対象化)。kotoba は撤去済み(ADR-0029)。
  # ルビ混入により絶対値は悲観側＝相対/回帰指標として扱う(fixtures/README参照)。
  ja-accuracy:
    name: 日本語精度 CER (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install build dependencies (whisper build)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev build-essential file clang libclang-dev cmake \
            libasound2-dev pkg-config

      - name: Cache whisper models (ja-accuracy)
        id: cache-ja-models
        uses: actions/cache@v6
        with:
          path: models
          key: ja-accuracy-models-tiny-base-turbo-v1
      - name: Download models (tiny / base / large-v3-turbo)
        if: steps.cache-ja-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          dl() { curl -L --fail --retry 5 --retry-delay 15 --retry-all-errors -o "$1" "$2"; }
          dl models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          dl models/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          dl models/ggml-large-v3-turbo-q5_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin

      # tauri のビルドマクロがアイコン(icons/32x32.png)を要求するため、ビルド前に生成する。
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate icons (tauri generate_context にアイコンが必要)
        run: npm run icons

      - name: Build test binary (compile excluded from run loop)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test transcribe_integration --no-run

      - name: Measure CER per model x sample
        run: |
          # cargo test はテストプロセスの CWD を src-tauri/ にするため、音源/モデルは絶対パスで渡す。
          FIX="$GITHUB_WORKSPACE/src-tauri/tests/fixtures/ja-accuracy"
          MODELS_DIR="$GITHUB_WORKSPACE/models"
          SLUGS="gingatetsudo-no-yoru kumonoito wagahaiha-neko-dearu"
          MODEL_IDS="tiny base large-v3-turbo"
          model_file() {
            case "$1" in
              tiny) echo "$MODELS_DIR/ggml-tiny.bin";;
              base) echo "$MODELS_DIR/ggml-base.bin";;
              large-v3-turbo) echo "$MODELS_DIR/ggml-large-v3-turbo-q5_0.bin";;
            esac
          }
          : > cer.tsv
          for slug in $SLUGS; do
            for mid in $MODEL_IDS; do
              # 出力も絶対パス（テストプロセスの CWD は src-tauri/ のため）。
              OUT="$GITHUB_WORKSPACE/hyp-$slug-$mid.txt"
              if ! QS_LANG=ja \
                QS_MODEL_PATH="$(model_file "$mid")" \
                QS_AUDIO_PATH="$FIX/$slug/audio.opus" \
                QS_TRANSCRIPT_OUT="$OUT" \
                  cargo test --manifest-path src-tauri/Cargo.toml \
                    --test transcribe_integration -- --nocapture > "run-$slug-$mid.log" 2>&1; then
                echo "::error::文字起こし失敗 $slug / $mid"; cat "run-$slug-$mid.log"; exit 1
              fi
              CER=$(python3 scripts/cer_ja.py "$FIX/$slug/reference.txt" "$OUT" | cut -f1)
              if [ -z "$CER" ]; then echo "::error::CER算出失敗 $slug / $mid"; exit 1; fi
              echo "measured $slug / $mid -> CER=$CER"
              printf "%s\t%s\t%s\n" "$slug" "$mid" "$CER" >> cer.tsv
            done
          done
          python3 - <<'PY' | tee ja-accuracy-report.md
          import collections, json, os
          rows=collections.defaultdict(dict)
          models=[]
          for line in open("cer.tsv"):
              slug,mid,cer=line.rstrip("\n").split("\t")
              rows[slug][mid]=float(cer)
              if mid not in models: models.append(mid)
          print("# QuickScribe 日本語精度ベンチ (CER / Linux)")
          print()
          print("| サンプル | " + " | ".join(models) + " |")
          print("|---|" + "---|"*len(models))
          sums={m:0.0 for m in models}
          for slug,vals in rows.items():
              cells=[]
              best=min(vals.values())
              for m in models:
                  v=vals[m]; sums[m]+=v
                  cells.append(("**%.1f%%**" if v==best else "%.1f%%") % (v*100))
              print(f"| {slug} | " + " | ".join(cells) + " |")
          n=len(rows)
          avg={m: sums[m]/n for m in models}
          bestavg=min(avg.values())
          cells=[("**%.1f%%**" if avg[m]==bestavg else "%.1f%%") % (avg[m]*100) for m in models]
          print("| **平均** | " + " | ".join(cells) + " |")
          print()
          print("_注: 本人音読のPD作品3点。原文へのルビ混入で絶対CERは悲観側＝相対/回帰指標。太字=各行の最良。_")
          # 回帰ゲート(#403): 平均CERが baseline+margin を超えたら警告する。
          bl=json.load(open("docs/perf/ja-cer-baseline.json", encoding="utf-8"))
          margin=bl["margin"]; base=bl["baselines"]; regressed=[]
          print(); print("## 回帰チェック（平均CER vs baseline）"); print()
          print("| モデル | 実測 | baseline | 上限(=+margin) | 判定 |"); print("|---|---|---|---|---|")
          for m in models:
              if m not in base: continue
              cur=avg[m]; lim=base[m]+margin
              ok = cur <= lim
              if not ok: regressed.append((m,cur,lim))
              print(f"| {m} | {cur*100:.1f}% | {base[m]*100:.1f}% | {lim*100:.1f}% | {'✅' if ok else '⚠️ 回帰'} |")
          for m,cur,lim in regressed:
              print(f"::warning title=日本語CER回帰::{m} の平均CER {cur*100:.1f}% が上限 {lim*100:.1f}% を超過")
          print(); print(f"_margin={margin*100:.0f}pt。基準は docs/perf/ja-cer-baseline.json。_")
          PY
          cat ja-accuracy-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ja-accuracy report
        uses: actions/upload-artifact@v7
        with:
          name: ja-accuracy-report
          path: ja-accuracy-report.md
          if-no-files-found: error

  # 起動時間ベンチ(#403 案A): run() 開始→フロント ready(onMount) の経過をアプリが記録し、
  # CI は xvfb でヘッドレス起動→ログ(perf-startup.txt)を回収する（外部計時器は不要＝突合方式）。
  startup-time:
    name: 起動時間 (Linux, xvfb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies (+xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev build-essential file clang libclang-dev cmake \
            libasound2-dev pkg-config xvfb
      - run: npm ci
      - name: Generate icons
        run: npm run icons
      - name: Build app (no bundle)
        run: npx tauri build --no-bundle
      - name: Measure startup time (xvfb)
        env:
          QS_PERF_STARTUP: "1"
        run: |
          BIN=$(find src-tauri/target/release -maxdepth 1 -type f -executable -iname 'quickscribe' | head -1)
          if [ -z "$BIN" ]; then echo "::error::app binary not found"; ls -la src-tauri/target/release; exit 1; fi
          echo "binary: $BIN"
          # アイドルCPU(#664): 常駐対象＝アプリ実体(quickscribe)＋WebKit 子プロセス群の
          # 累積 CPU 時間(utime+stime, tick)。/proc/<pid>/stat の comm は括弧内で空白を含みうるため
          # ')' 以降を切り出してから数える（先頭2フィールドを落とすので utime=f[12], stime=f[13]）。
          app_cpu_ticks() {
            local total=0 pid t
            for pid in $(pgrep -x quickscribe 2>/dev/null) \
                       $(pgrep -f 'WebKit(WebProcess|NetworkProcess)' 2>/dev/null); do
              [ -r "/proc/$pid/stat" ] || continue
              t=$(awk '{ s=substr($0, index($0,")")+2); split(s,f," "); print f[12]+f[13] }' "/proc/$pid/stat")
              total=$((total + t))
            done
            echo "$total"
          }
          # 使用率(%) = (消費CPU秒 / 経過実時間秒) * 100。1コア基準（100% = 1コア占有）。
          cpu_pct() {
            awk -v d="$1" -v hz="$2" -v ns="$3" \
              'BEGIN{ e = ns / 1000000000; if (e <= 0 || hz <= 0) { print "n/a"; exit } printf "%.2f", (d / hz) / e * 100 }'
          }
          LOG="$HOME/.local/share/QuickScribe/logs/perf-startup.txt"
          rm -f "$LOG"
          # ヘッドレス表示で起動 → onMount で report_startup が LOG を書く → 回収 → 終了。
          xvfb-run -a "$BIN" >/tmp/app.out 2>&1 &
          APP_PID=$!
          for _ in $(seq 1 40); do [ -f "$LOG" ] && break; sleep 1; done
          if [ -f "$LOG" ]; then
            MS=$(sed -n 's/^startup_ms=//p' "$LOG")
            # ready 直後は起動処理の残り(モデル一覧の走査など)が走っているので、
            # 数秒おいて落ち着かせてから「アイドル」を観測する(#664)。
            sleep 3
            CLK_TCK=$(getconf CLK_TCK)
            # 観測窓を SEG_SEC 秒 × SEG_COUNT 区間に分割して区間ごとに出す(#678)。
            # 10 秒の1点測りでは同一コミット(c5f2109)で 8.78 / 4.05 / 5.72 % と 2.2 倍振れ、
            # 回帰ゲートの閾値を置けなかった(同じ窓で RSS は 150.3/150.6/150.7 MB と安定)。
            # 区間別に出せば「起動処理の残りを窓が掴んでいる(第1区間だけ高い)」のか
            # 「xvfb の WebKitGTK が定常的に焼いている(全区間横ばい)」のかを1ランで区別できる。
            # 第1区間は従来と同じ定義(settle 3 秒 + 10 秒窓)なので、過去の実測と直接比較できる。
            SEG_COUNT=6
            SEG_SEC=10
            SEG_ROWS=/tmp/idle-cpu-segments.md
            : > "$SEG_ROWS"
            PEAK_RSS_KB=0
            TOTAL_TICKS=0; TOTAL_NS=0
            STEADY_TICKS=0; STEADY_NS=0
            SEG1_PCT="n/a"
            CPU_T0=$(app_cpu_ticks); NS0=$(date +%s%N)
            for seg in $(seq 1 "$SEG_COUNT"); do
              # アイドル時メモリ(#403): 窓全体を通してアプリ実プロセスの RSS をサンプルし最大値を採る。
              # xvfb-run の子として動く実体(quickscribe)を名前で拾う（APP_PID は xvfb-run のラッパ）。
              for _ in $(seq 1 "$SEG_SEC"); do
                RSS_KB=$(ps -C quickscribe -o rss= 2>/dev/null | sort -n | tail -1 | tr -d ' ')
                [ -n "$RSS_KB" ] && [ "$RSS_KB" -gt "$PEAK_RSS_KB" ] && PEAK_RSS_KB=$RSS_KB
                sleep 1
              done
              CPU_T1=$(app_cpu_ticks); NS1=$(date +%s%N)
              SEG_TICKS=$((CPU_T1 - CPU_T0)); SEG_NS=$((NS1 - NS0))
              SEG_PCT=$(cpu_pct "$SEG_TICKS" "$CLK_TCK" "$SEG_NS")
              echo "idle cpu seg${seg}: ticks=${SEG_TICKS} clk_tck=${CLK_TCK} window_ns=${SEG_NS} pct=${SEG_PCT}"
              echo "| ${seg} | $(( (seg - 1) * SEG_SEC ))–$(( seg * SEG_SEC )) s | ${SEG_TICKS} | ${SEG_PCT} % |" >> "$SEG_ROWS"
              TOTAL_TICKS=$((TOTAL_TICKS + SEG_TICKS)); TOTAL_NS=$((TOTAL_NS + SEG_NS))
              if [ "$seg" -eq 1 ]; then
                SEG1_PCT="$SEG_PCT"
              else
                # 定常値は第2区間以降。起動処理の残りが混じりうる第1区間を除く。
                STEADY_TICKS=$((STEADY_TICKS + SEG_TICKS)); STEADY_NS=$((STEADY_NS + SEG_NS))
              fi
              CPU_T0=$CPU_T1; NS0=$NS1
            done
            kill "$APP_PID" 2>/dev/null || true
            pkill -x quickscribe 2>/dev/null || true
            IDLE_RSS_MB=$(awk -v k="$PEAK_RSS_KB" 'BEGIN{ printf "%.1f", k/1024 }')
            IDLE_CPU_PCT=$(cpu_pct "$TOTAL_TICKS" "$CLK_TCK" "$TOTAL_NS")
            IDLE_CPU_STEADY_PCT=$(cpu_pct "$STEADY_TICKS" "$CLK_TCK" "$STEADY_NS")
            echo "idle cpu total: ticks=${TOTAL_TICKS} window_ns=${TOTAL_NS} pct=${IDLE_CPU_PCT}"
            echo "idle cpu steady(seg2-${SEG_COUNT}): ticks=${STEADY_TICKS} window_ns=${STEADY_NS} pct=${IDLE_CPU_STEADY_PCT}"
            {
              echo "# QuickScribe 起動時間・アイドル資源 (Linux x64 / xvfb)"
              echo ""
              echo "| 指標 | 値 |"
              echo "|---|---|"
              echo "| **起動時間 (run()→UI ready)** | **${MS} ms** |"
              echo "| **アイドル時メモリ (アプリ実体 RSS)** | **${IDLE_RSS_MB} MB** |"
              echo "| **アイドル時 CPU — 定常 (第2〜${SEG_COUNT}区間 / $(( (SEG_COUNT - 1) * SEG_SEC )) 秒窓)** | **${IDLE_CPU_STEADY_PCT} %** |"
              echo "| アイドル時 CPU — 全窓 ($(( SEG_COUNT * SEG_SEC )) 秒) | ${IDLE_CPU_PCT} % |"
              echo "| アイドル時 CPU — 第1区間 (旧定義・過去比較用) | ${SEG1_PCT} % |"
              echo ""
              echo "## アイドル CPU の区間別内訳"
              echo ""
              echo "| 区間 | 経過 (settle 後) | Δtick | CPU (1コア基準) |"
              echo "|---|---|---|---|"
              cat "$SEG_ROWS"
              echo ""
              echo "_注: 起動時間=run 入口→フロント onMount。アイドルRSS=ready 後のアプリ実プロセス(quickscribe)のピーク RSS。_"
              echo "_アイドルCPU=ready+3秒後から ${SEG_SEC} 秒 × ${SEG_COUNT} 区間の (utime+stime) 増分 / 経過実時間。1コア基準(100%=1コア占有)。CLK_TCK=${CLK_TCK}。_"
              echo "_**回帰の判定には「定常」を使う。** 第1区間は起動処理の残りを掴みうるため参考値（旧 10 秒窓と同じ定義）。_"
              echo "_計測対象は quickscribe と WebKit(WebProcess|NetworkProcess)。ヘッドレス表示(xvfb)。_"
              echo ""
              echo "_Windows 限定コード(タスクバーウィジェット等)は本ジョブに現れない。Windows 側の計測は #664 Phase 2 を参照。_"
            } | tee startup-report.md
            cat startup-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            kill "$APP_PID" 2>/dev/null || true
            echo "::warning::perf-startup.txt 未生成（表示/依存の問題の可能性）。ログ:"; cat /tmp/app.out || true
            exit 1
          fi
      - name: Upload startup report
        uses: actions/upload-artifact@v7
        with:
          name: startup-report
          path: startup-report.md
          if-no-files-found: warn

  # 日本語CER(公開コーパス / ADR-0024・#578): Common Voice ja(CC0)を CI 実行時に取得し(**非同梱**)、
  # large-v3-turbo(日本語既定)で文字起こし→正規化CER＋ブートストラップ95%CIを算出する。手動 dispatch 限定
  # (リリースを重くしない)。既存の ja-accuracy(自前録音)は smoke として別途残す。
  ja-cer-corpus:
    name: 日本語CER 公開コーパス (Common Voice / Linux)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install build dependencies (whisper build)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev build-essential file clang libclang-dev cmake \
            libasound2-dev pkg-config
      - name: Cache whisper model (large-v3-turbo)
        id: cache-corpus-model
        uses: actions/cache@v6
        with:
          path: models
          key: ja-corpus-model-turbo-v1
      - name: Download model (large-v3-turbo)
        if: steps.cache-corpus-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -L --fail --retry 5 --retry-delay 15 --retry-all-errors \
            -o models/ggml-large-v3-turbo-q5_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate icons (tauri generate_context にアイコンが必要)
        run: npm run icons
      - name: Build test binary (compile excluded from run loop)
        run: cargo test --manifest-path src-tauri/Cargo.toml --test transcribe_integration --no-run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install eval deps (CI専用・datasets + neologdn)
        # datasets は 2.x にピン。fsicoli ミラーはローディングスクリプト方式で、datasets 4.0+ は
        # スクリプト対応(trust_remote_code)を廃止したため 5.x では読めない（#578 スパイクで判明）。
        run: pip install -r scripts/asr_eval/requirements.txt "datasets>=2.19,<3" soundfile librosa
      - name: Fetch corpora (Common Voice ja[CC0] + FLEURS ja[CC-BY]・非同梱・streaming)
        run: |
          python scripts/asr_eval/fetch_hf_corpus.py \
            --out-dir "$GITHUB_WORKSPACE/cv_ja" --num 50 \
            --dataset fsicoli/common_voice_17_0 --config ja --split test \
            --text-column sentence --prefix cv
          python scripts/asr_eval/fetch_hf_corpus.py \
            --out-dir "$GITHUB_WORKSPACE/fleurs_ja" --num 50 \
            --dataset google/fleurs --config ja_jp --split test \
            --text-column raw_transcription --prefix fleurs
      - name: Transcribe + CER per corpus (large-v3-turbo)
        run: |
          MODEL="$GITHUB_WORKSPACE/models/ggml-large-v3-turbo-q5_0.bin"
          # 1コーパス分を文字起こしする（モデルは各サンプルで再ロード=dispatch限定なので許容）。
          transcribe_corpus() {
            local dir="$1" hyp="$2"
            mkdir -p "$hyp"
            while IFS=$'\t' read -r fn ref; do
              [ -z "$fn" ] && continue
              QS_LANG=ja QS_MODEL_PATH="$MODEL" \
                QS_AUDIO_PATH="$dir/$fn" QS_TRANSCRIPT_OUT="$hyp/$fn.txt" \
                cargo test --manifest-path src-tauri/Cargo.toml \
                  --test transcribe_integration -- --nocapture > /dev/null 2>&1 \
                || echo "::warning::transcribe failed for $fn"
            done < "$dir/manifest.tsv"
          }
          transcribe_corpus "$GITHUB_WORKSPACE/cv_ja" "$GITHUB_WORKSPACE/hyp_cv"
          transcribe_corpus "$GITHUB_WORKSPACE/fleurs_ja" "$GITHUB_WORKSPACE/hyp_fleurs"
          cd scripts/asr_eval
          python report_cer.py --manifest "$GITHUB_WORKSPACE/cv_ja/manifest.tsv" \
            --hyp-dir "$GITHUB_WORKSPACE/hyp_cv" --label "Common Voice ja (large-v3-turbo)" \
            --report "$GITHUB_WORKSPACE/ja-cer-corpus-report.md"
          python report_cer.py --manifest "$GITHUB_WORKSPACE/fleurs_ja/manifest.tsv" \
            --hyp-dir "$GITHUB_WORKSPACE/hyp_fleurs" --label "FLEURS ja (large-v3-turbo)" \
            --report "$GITHUB_WORKSPACE/ja-cer-corpus-report.md"
          cat "$GITHUB_WORKSPACE/ja-cer-corpus-report.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: ja-cer-corpus-report
          path: ja-cer-corpus-report.md
          if-no-files-found: warn
