# cargo-audit 設定 — 脆弱性データベース照合のホワイトリストを定義する (ADR-0034)。
# 実行: cargo audit (CI security.yml)。

[advisories]
# unmaintained/notice を有効化したまま、既知の上流未メンテナンス・Soundness警告のみを
# 明示的にホワイトリストに登録することで、品質ゲートの厳格性を維持する（ADR-0034）。
# 新規の未メンテナンス依存が混入した場合は CI で検出・ブロックする。
ignore = [
    # glib 0.18 unsoundness / GTK3 bindings unmaintained (Tauri 2.x の Webkit2GTK 必須依存)
    # これらは統合 Issue #686 で計画的に追跡中。再評価期限 2026-10-31。
    "RUSTSEC-2024-0429", # glib unsoundness
    "RUSTSEC-2024-0413", # atk unmaintained
    "RUSTSEC-2024-0416", # atk-sys unmaintained
    "RUSTSEC-2024-0412", # gdk unmaintained
    "RUSTSEC-2024-0418", # gdk-sys unmaintained
    "RUSTSEC-2024-0411", # gdkwayland-sys unmaintained
    "RUSTSEC-2024-0417", # gdkx11 unmaintained
    "RUSTSEC-2024-0414", # gdkx11-sys unmaintained
    "RUSTSEC-2024-0415", # gtk unmaintained
    "RUSTSEC-2024-0420", # gtk-sys unmaintained
    "RUSTSEC-2024-0419", # gtk3-macros unmaintained
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained (Tauri/serdeマクロ等で使用、代替なし)

    # audiopus_sys (unmaintained, whisper-rs等の依存で使用。代替なし)
    "RUSTSEC-2026-0150",

    # rust-unic (unmaintained、Tauri経由の urlpattern が依存。代替なし)
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
]
