# cargo-deny 設定 — ライセンス allowlist を強制し、非互換ライセンスの混入を CI で防ぐ。
# 法的MUST(ADR-0010): 配布バイナリに含まれる依存のライセンスを許可リストに固定する。
# 実行: cargo deny check licenses (CI security.yml)。新規依存で未許可ライセンスが入ると失敗する。

[licenses]
# OSI 承認のパーミッシブ系のみ許可（MIT 配布物に同梱可能なもの）。
# コピーレフト(GPL/AGPL/LGPL等)は許可しない＝混入したら CI で検出して対処する。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Unlicense",
    "OpenSSL",
]
# ライセンス検出の信頼度しきい値（テキスト一致率）。
confidence-threshold = 0.8

# 個別 crate のライセンス明示が必要な場合はここに exceptions/clarify を追記する（CI が示したら対応）。
# 例: [[licenses.clarify]] name = "ring" ...

[bans]
# 重複/禁止クレートの検査は v1.0.0 の衛生課題。ここでは緩め（法的MUSTの範囲外）。
multiple-versions = "allow"

[advisories]
# unmaintained/notice を有効化したまま、既知の上流未メンテナンス・Soundness警告のみを
# 明示的にホワイトリストに登録することで、品質ゲートの厳格性を維持する（ADR-0034）。
# 各未メンテナンス警告の受容理由と回避不可能性は docs/process/gtk3-rs-unmaintained-sweep.md に
# 一元管理されています。再評価期限 2026-10-31 (ADR-0034 / #686)。
ignore = [
    "RUSTSEC-2024-0429", # glib unsoundness (docs/process/gtk3-rs-unmaintained-sweep.md)
    "RUSTSEC-2024-0413", # atk unmaintained (docs/process/gtk3-rs-unmaintained-sweep.md)
    "RUSTSEC-2024-0416", # atk-sys unmaintained (docs/process/gtk3-rs-unmaintained-sweep.md)
    "RUSTSEC-2024-0412", # gdk unmaintained (docs/process/gtk3-rs-unmaintained-sweep.md)
    "RUSTSEC-2024-0418", # gdk-sys unmaintained (docs/process/gtk3-rs-unmaintained-sweep.md)
    "RUSTSEC-2024-0411", # gdkwayland-sys unmaintained (docs/process/gtk3-rs-unmaintained-sweep.md)
    "RUSTSEC-2024-0417", # gdkx11 unmaintained (docs/process/gtk3-rs-unmaintained-sweep.md)
    "RUSTSEC-2024-0414", # gdkx11-sys unmaintained (docs/process/gtk3-rs-unmaintained-sweep.md)
    "RUSTSEC-2024-0415", # gtk unmaintained (docs/process/gtk3-rs-unmaintained-sweep.md)
    "RUSTSEC-2024-0420", # gtk-sys unmaintained (docs/process/gtk3-rs-unmaintained-sweep.md)
    "RUSTSEC-2024-0419", # gtk3-macros unmaintained (docs/process/gtk3-rs-unmaintained-sweep.md)
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained (代替なし、docs/process/gtk3-rs-unmaintained-sweep.md 参照)

    # audiopus_sys (unmaintained, whisper-rs等の依存で使用。代替なし)
    "RUSTSEC-2026-0150",

    # rust-unic (unmaintained、Tauri経由の urlpattern が依存。代替なし)
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
]
